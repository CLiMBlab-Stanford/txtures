name: Checks

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install textures and development dependencies
        run: uv sync --frozen --group dev --python 3.12
      - name: Check formatting
        run: uv run --frozen ruff format --check src tests .github/workflows
      - name: Check Python style
        run: uv run --frozen ruff check src tests .github/workflows
      - name: Run complete test suite
        run: uv run --frozen pytest -q -m "integration or not integration"
