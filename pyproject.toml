[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "txtures"
version = "0.6.0"
description = "Word- and region-level features of text for psycholinguistic research"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Cory Shain" }]
keywords = ["psycholinguistics", "surprisal", "language models", "reading times"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "huggingface-hub>=1,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "prsr>=0.1,<0.2",
    "pyarrow>=15",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "stanza>=1.10,<2",
    "transformers>=5,<6",
]

[project.optional-dependencies]
# Exactly one of these selects the PyTorch build. `./install --compute`
# chooses between them.
cuda = ["torch>=2.4,<3"]
cpu = ["torch>=2.4,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.urls]
Documentation = "https://txtures.readthedocs.io"
Repository = "https://github.com/CLiMBlab-Stanford/txtures"
Issues = "https://github.com/CLiMBlab-Stanford/txtures/issues"

[project.scripts]
txtures = "txtures.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
txtures = ["tools/tools.def"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: downloads models or exercises process and filesystem boundaries",
    "heavy: loads neural models, such as the toy language model or Stanza; skipped by --fast",
    "tools: runs programs in the tools image; skipped where the image is not built",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
